services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitcoin_accounting
      POSTGRES_PASSWORD: bitcoin_accounting
      POSTGRES_DB: bitcoin_accounting
      POSTGRES_TEST_DB: bitcoin_accounting_test
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
