[mypy]
# IMPORTANT: Run mypy from src/python/ directory to avoid module path issues:
#   cd src/python && ../../.venv/bin/python -m mypy .
# Or check specific modules:
#   cd src/python && ../../.venv/bin/python -m mypy db/queries/

# Exclude test files from type checking
exclude = (tests/|.*_test\.py$)

# Support namespace packages (needed for imports submodules)
namespace_packages = True

# Prevent "found twice under different module names" errors
explicit_package_bases = True

# Enable type checking but allow gradual typing
check_untyped_defs = True
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_reexport = True

# Don't require all functions to have type annotations (gradual typing)
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Show error codes in output (helpful for knowing which rule failed)
show_error_codes = True

# Show column numbers in errors
show_column_numbers = True

# Pretty output
pretty = True

# Strict mode for new query classes (they already have type annotations)
[mypy-db.queries.*]
strict = True

# Ignore missing imports for test files
# Tests often use sys.path manipulation and runtime imports
[mypy-tests.*]
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False
# Don't check test files strictly - they call untyped code
ignore_errors = True

# Legacy code - allow untyped defs (add type hints gradually)
[mypy-cryptoAccounts]
disallow_untyped_defs = False
check_untyped_defs = False

# Third-party libraries without type stubs
[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-yfinance.*]
ignore_missing_imports = True
