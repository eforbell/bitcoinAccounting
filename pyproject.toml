[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-accounting"
version = "1.0.0"
description = "Bitcoin accounting toolkit with an interactive Textual TUI and optional web app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "pandas",
    "matplotlib",
    "prompt_toolkit",
    "requests",
    "certifi>=2026.10.19",
    "python-dotenv",
    "yfinance",
    "pyarrow",
    "reportlab",
    "openpyxl",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "textual>=0.47.0",
    "python-multipart",
    "mcp>=2,<3",
    # Home Base's suite identity (tailnet mode): request guards, the directory snapshot, member resolution.
    # Pinned to a commit: hosts install it from the public repo with no credentials. Move the pin deliberately.
    "sovereign-auth @ git+https://github.com/eforbell/sovereignAuth@433a477648632062fc5102d91dadb29e9d5d373f#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "httpx2",
    "playwright",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
bitcoin-accounting = "bitcoinAccounting:main"
bitcoin-integrity = "integrity.cli:main"
bitcoin-accounting-web-init = "web.cli:main"
bitcoin-accounting-web = "web.server:main"
bitcoin-mcp        = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src/python"}
py-modules = ["bitcoinAccounts", "bitcoinAccounting", "mcp_server"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["attestation*", "db*", "imports*", "integrity*", "tui*", "viz*", "web*"]

[tool.setuptools.package-data]
web = [
    "ui/*.html",
    "ui/static/*",
    "ui/static/brand/*",
    "ui/static/vendor/*",
]
