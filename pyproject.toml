[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-accounting"
version = "0.1.0"
description = "Bitcoin accounting toolkit with an interactive Textual TUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "pandas",
    "matplotlib",
    "prompt_toolkit",
    "requests",
    "python-dotenv",
    "yfinance",
    "pyarrow",
    "reportlab",
    "openpyxl",
    "textual>=0.47.0",
]

[project.scripts]
bitcoin-accounting = "bitcoinAccounting:main"
bitcoin-integrity = "integrity.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}
py-modules = ["bitcoinAccounts", "bitcoinAccounting"]

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["db*", "imports*", "integrity*", "tui*", "viz*"]
